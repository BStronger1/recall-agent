name: Publish interactive demo
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: yu-ai-agent-frontend/package-lock.json
      - run: npm ci && npm run build
        working-directory: yu-ai-agent-frontend
        env:
          VITE_BASE_PATH: /recall-agent/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: yu-ai-agent-frontend/dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
