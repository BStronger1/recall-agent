name: Verify Recall Agent
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: yu-ai-agent-frontend/package-lock.json
      - run: npm ci && npm run build
        working-directory: yu-ai-agent-frontend
      - run: mvn -B -f recall-server/pom.xml verify
